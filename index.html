<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TSMC WorkLog</title>
  <style>
    :root{--bg:#f7f7f5;--card:#fff;--ink:#242424;--muted:#74716d;--line:#e5e3df;--blue:#2783de;--blue2:#e5f2fc;--green:#46a171;--orange:#d5803b;--red:#e56458;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app{min-height:100vh;display:grid;grid-template-columns:280px 1fr}.side{padding:24px;border-right:1px solid var(--line);background:#fff;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2783de,#72bc8f);display:grid;place-items:center;color:#fff;font-weight:800}.brand h1{font-size:20px;margin:0}.brand p{margin:0;color:var(--muted);font-size:12px}.nav button{width:100%;min-height:44px;border:0;background:transparent;text-align:left;border-radius:10px;padding:10px 12px;color:var(--muted);font-weight:650;cursor:pointer}.nav button.active,.nav button:hover{background:var(--blue2);color:var(--blue)}.main{padding:28px;max-width:1500px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.title h2{font-size:28px;line-height:1.1;margin:0 0 6px}.title p{margin:0;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer;color:var(--ink)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.metric{font-size:26px;font-weight:800}.label{color:var(--muted);font-size:12px}.toolbar{display:grid;grid-template-columns:1fr 150px 160px 150px auto;gap:10px;margin-bottom:14px}.input,.select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;min-height:42px;font:inherit}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left;vertical-align:top}th{background:#fbfbfa;color:var(--muted);font-size:12px;position:sticky;top:0;z-index:1}tbody tr:hover{background:#fafcff}.ticket{font-weight:800;color:#1f6fbd}.desc{max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800}.Report{background:#e5f2fc;color:#1f6fbd}.Relocate{background:#fbebde;color:#98571e}.Done{background:#e8f1ec;color:#2d7650}.rowbtn{border:0;background:transparent;color:var(--blue);font-weight:800;cursor:pointer;padding:6px}.empty{padding:40px;text-align:center;color:var(--muted)}.pager{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#fff}.drawer{position:fixed;inset:0;display:none;z-index:10}.drawer.open{display:block}.shade{position:absolute;inset:0;background:rgba(0,0,0,.22)}.panel{position:absolute;right:0;top:0;height:100%;width:min(720px,100%);background:#fff;padding:24px;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-weight:750;margin-bottom:6px}.toast{position:fixed;right:20px;bottom:20px;background:#202020;color:#fff;border-radius:12px;padding:12px 14px;display:none}.toast.show{display:block}.loading{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;place-items:center;z-index:20}.loading.show{display:grid}.spin{width:44px;height:44px;border-radius:50%;border:4px solid #d8eafa;border-top-color:var(--blue);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.cards{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.tablewrap{overflow-x:auto}.top{display:block}.actions{margin-top:14px}.formgrid{grid-template-columns:1fr}}
    @media(max-width:520px){.main,.side{padding:16px}.cards{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.title h2{font-size:24px}}
  </style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">WL</div><div><h1>TSMC WorkLog</h1><p>Google Sheet + GAS Backend</p></div></div><nav class="nav"><button class="active">📋 WorkLog</button><button onclick="refresh()">🔄 Refresh</button><button onclick="openNew()">＋ Add record</button></nav></aside>
<main class="main"><div class="top"><div class="title"><h2>WorkLog Dashboard</h2><p>ค้นหา ดูรายละเอียด แก้ไข อัพเดท และลบข้อมูล Ticket จาก Google Sheet</p></div><div class="actions"><button class="btn" onclick="refresh()">Refresh</button><button class="btn primary" onclick="openNew()">Add WorkLog</button></div></div>
<section class="cards"><div class="card"><div class="metric" id="mTotal">0</div><div class="label">Total records</div></div><div class="card"><div class="metric" id="mReport">0</div><div class="label">Report</div></div><div class="card"><div class="metric" id="mRelocate">0</div><div class="label">Relocate</div></div><div class="card"><div class="metric" id="mDone">0</div><div class="label">Done</div></div></section>
<section class="toolbar"><input class="input" id="q" placeholder="ค้นหา Ticket / Description / Cause / Solution" oninput="applyFilters()"><select class="select" id="status" onchange="applyFilters()"><option value="">All status</option><option>Report</option><option>Relocate</option><option>Done</option></select><select class="select" id="person" onchange="applyFilters()"><option value="">All responsibility</option></select><input class="input" id="date" type="date" onchange="applyFilters()"><button class="btn" onclick="clearFilters()">Clear</button></section>
<section class="tablewrap"><table><thead><tr><th>#</th><th>Date</th><th>Ticket</th><th>Description</th><th>Status</th><th>Endpoint</th><th>Responsibility</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" style="display:none">ไม่พบข้อมูล</div><div class="pager"><button class="btn" onclick="prevPage()">Prev</button><span id="pageInfo"></span><button class="btn" onclick="nextPage()">Next</button></div></section></main></div>
<div class="drawer" id="drawer"><div class="shade" onclick="closeDrawer()"></div><div class="panel"><div class="top"><div class="title"><h2 id="formTitle">Add WorkLog</h2><p>กรอกข้อมูลให้ตรงกับคอลัมน์ใน Sheet</p></div><button class="btn" onclick="closeDrawer()">Close</button></div><form id="form" class="formgrid" onsubmit="saveRecord(event)"></form></div></div><div class="loading" id="loading"><div class="spin"></div></div><div class="toast" id="toast"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwAMDvzBi-azwulnM-JzaD-QK7Oiq_PXX1jMN4H1X3_9uZvcJ5tXNGE8IkaU3dK9co6lA/exec';
const COLS = ['#','Date','Week','Ticket','Description','Cause','Solution','Status','EndPoint','Responsibilty','Remark'];
let rows=[], filtered=[], current=null, page=1, pageSize=12;
const sample = [{"#":1,Date:'2026-03-13',Week:'Friday',Ticket:'JB26-0499400',Description:'Customer issue: Change Owner error and duplicated account.',Cause:'Promotion not allowed for Change Owner; duplicate create account.',Solution:'Interim workaround and long-term create account check.',Status:'Report',EndPoint:'',Responsibilty:'Fame',Remark:''},{"#":2,Date:'2026-03-13',Week:'Friday',Ticket:'JB26-0499526',Description:'Easy App device purchase completed but subscriber not converted.',Cause:'Read card chipNo empty caused missing Birthday field.',Solution:'Updated data and re-provisioning completed.',Status:'Report',EndPoint:'',Responsibilty:'Tar',Remark:''},{"#":3,Date:'2026-03-13',Week:'Friday',Ticket:'JB26-0499721',Description:'Dealer mapping displayed wrong location.',Cause:'Mapping file showed Dealer 82171 while MC sent another value.',Solution:'Pending related team check.',Status:'Relocate',EndPoint:'SKY',Responsibilty:'Kong',Remark:''}];
function api(action, payload={}){
  if(API_URL.includes('PASTE_')) return Promise.resolve(mock(action,payload));
  // GitHub Pages -> Google Apps Script has CORS limits. Use JSONP over GET.
  return new Promise((resolve, reject)=>{
    const cb = 'gas_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timer = setTimeout(()=>{ cleanup(); reject(new Error('API timeout / Deploy permission issue')); }, 20000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb] = (j)=>{ cleanup(); if(!j.ok) reject(new Error(j.error||'API error')); else resolve(j.data); };
    const url = API_URL + '?callback=' + encodeURIComponent(cb) + '&payload=' + encodeURIComponent(JSON.stringify({action,...payload}));
    script.onerror = ()=>{ cleanup(); reject(new Error('โหลด API ไม่สำเร็จ: ตรวจสอบ Web app deployment')); };
    script.src = url;
    document.body.appendChild(script);
  });
}
function mock(action,p){ if(action==='list') return rows.length?rows:sample; if(action==='create'){p.record['#']=Math.max(0,...rows.map(r=>+r['#']||0))+1; rows.unshift(p.record); return p.record} if(action==='update'){rows=rows.map(r=>String(r['#'])===String(p.id)?{...r,...p.record}:r); return p.record} if(action==='delete'){rows=rows.filter(r=>String(r['#'])!==String(p.id)); return true} }
function showLoading(v){document.getElementById('loading').classList.toggle('show',v)} function toast(t){const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2600)}
async function refresh(){showLoading(true); try{rows=await api('list'); applyFilters(); toast('โหลดข้อมูลเรียบร้อย');}catch(e){toast(e.message)} finally{showLoading(false)}}
function applyFilters(){let q=document.getElementById('q').value.toLowerCase(), st=document.getElementById('status').value, ps=document.getElementById('person').value, dt=document.getElementById('date').value; filtered=rows.filter(r=>(!q||COLS.some(c=>String(r[c]||'').toLowerCase().includes(q)))&&(!st||r.Status===st)&&(!ps||r.Responsibilty===ps)&&(!dt||String(r.Date||'').slice(0,10)===dt)); page=1; render();}
function clearFilters(){['q','status','person','date'].forEach(id=>document.getElementById(id).value=''); applyFilters()}
function render(){document.getElementById('mTotal').textContent=rows.length; document.getElementById('mReport').textContent=rows.filter(r=>r.Status==='Report').length; document.getElementById('mRelocate').textContent=rows.filter(r=>r.Status==='Relocate').length; document.getElementById('mDone').textContent=rows.filter(r=>r.Status==='Done').length; let persons=[...new Set(rows.map(r=>r.Responsibilty).filter(Boolean))].sort(); document.getElementById('person').innerHTML='<option value="">All responsibility</option>'+persons.map(p=>`<option>${p}</option>`).join(''); let start=(page-1)*pageSize, pageRows=filtered.slice(start,start+pageSize); document.getElementById('empty').style.display=pageRows.length?'none':'block'; document.getElementById('tbody').innerHTML=pageRows.map(r=>`<tr><td>${r['#']||''}</td><td>${fmt(r.Date)}</td><td class="ticket">${esc(r.Ticket)}</td><td class="desc" title="${esc(r.Description)}">${esc(r.Description)}</td><td><span class="pill ${r.Status||''}">${esc(r.Status)}</span></td><td>${esc(r.EndPoint)}</td><td>${esc(r.Responsibilty)}</td><td><button class="rowbtn" onclick='openEdit(${JSON.stringify(r).replaceAll("'","&#39;")})'>Edit</button><button class="rowbtn" onclick='removeRecord(${JSON.stringify(r["#"])})'>Delete</button></td></tr>`).join(''); document.getElementById('pageInfo').textContent=`Page ${page} / ${Math.max(1,Math.ceil(filtered.length/pageSize))} • ${filtered.length} rows`;}
function fmt(v){return String(v||'').slice(0,10)} function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))} function nextPage(){if(page<Math.ceil(filtered.length/pageSize)){page++;render()}} function prevPage(){if(page>1){page--;render()}}
function buildForm(rec={}){current=rec['#']?rec:null; document.getElementById('formTitle').textContent=current?'Edit WorkLog':'Add WorkLog'; document.getElementById('form').innerHTML=COLS.filter(c=>c!=='#').map(c=>`<div class="field ${['Description','Cause','Solution','Remark'].includes(c)?'full':''}"><label>${c}</label>${['Description','Cause','Solution','Remark'].includes(c)?`<textarea name="${c}" rows="4">${esc(rec[c])}</textarea>`: c==='Status'?`<select name="Status"><option></option><option ${rec[c]==='Report'?'selected':''}>Report</option><option ${rec[c]==='Relocate'?'selected':''}>Relocate</option><option ${rec[c]==='Done'?'selected':''}>Done</option></select>`:`<input class="input" name="${c}" value="${esc(rec[c])}" ${c==='Date'?'type="date"':''}>`}</div>`).join('')+`<div class="field full actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" onclick="closeDrawer()">Cancel</button></div>`;}
function openNew(){buildForm({Date:new Date().toISOString().slice(0,10)}); document.getElementById('drawer').classList.add('open')} function openEdit(r){buildForm(r); document.getElementById('drawer').classList.add('open')} function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
async function saveRecord(e){e.preventDefault(); let fd=new FormData(e.target), rec=Object.fromEntries(fd.entries()); showLoading(true); try{ if(current) await api('update',{id:current['#'],record:rec}); else await api('create',{record:rec}); closeDrawer(); await refresh(); toast('บันทึกเรียบร้อย');}catch(err){toast(err.message)} finally{showLoading(false)}}
async function removeRecord(id){if(!confirm('ต้องการลบรายการนี้?')) return; showLoading(true); try{await api('delete',{id}); await refresh(); toast('ลบข้อมูลแล้ว')}catch(e){toast(e.message)} finally{showLoading(false)}}
refresh();
</script></body></html>
