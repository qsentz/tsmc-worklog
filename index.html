<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSMC WorkLog Fast Sync</title><style>body{margin:0;background:#f4f7fb;font:14px system-ui;color:#111827}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:#fff;padding:24px;border-right:1px solid #e2e8f0}.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:grid;place-items:center;color:white;font-weight:900}.brand h1{margin:0;font-size:20px}.brand p{margin:0;color:#64748b;font-size:12px}.nav button{width:100%;height:46px;border:0;background:transparent;border-radius:14px;text-align:left;padding:0 14px;font-weight:800;color:#475569;cursor:pointer}.nav button.active,.nav button:hover{background:#e5f2fc;color:#2563eb}.main{padding:28px;max-width:1500px;width:100%;margin:0 auto}.hero,.card,.tablewrap{background:#fffffff0;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 18px 50px #0f172a18}.hero{padding:24px;margin-bottom:18px}.top{display:flex;justify-content:space-between;gap:16px}.title h2{font-size:34px;margin:0 0 8px}.title p{color:#64748b;margin:0}.btn{height:44px;border:1px solid #e2e8f0;background:white;border-radius:14px;padding:0 16px;font-weight:900;cursor:pointer}.primary{background:#2563eb!important;color:white!important;border:0!important}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}.card{padding:18px}.metric{font-size:32px;font-weight:950}.label{color:#64748b;font-weight:700}.toolbar{display:grid;grid-template-columns:1fr 160px 180px 150px auto;gap:12px;margin-bottom:18px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:15px;padding:12px;min-height:44px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #eef2f7;padding:13px;text-align:left}th{background:#f8fafc;color:#64748b;font-size:12px}.ticket,.link{color:#2563eb;font-weight:900}.link{border:0;background:transparent;cursor:pointer}.pill{border-radius:99px;padding:4px 9px;font-size:12px;font-weight:900}.Inprocess{background:#fef3c7;color:#92400e}.Report{background:#dbeafe;color:#1e40af}.Relocate{background:#ffedd5;color:#9a3412}.Done{background:#dcfce7;color:#166534}.pager{padding:14px;display:flex;justify-content:space-between}.drawer{position:fixed;inset:0;background:#0f172a55;display:none;z-index:20}.drawer.open{display:block}.panel{position:absolute;right:18px;top:18px;bottom:18px;width:min(820px,calc(100% - 36px));background:white;border-radius:26px;padding:24px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.radio{display:flex;gap:10px;flex-wrap:wrap}.radio label{border:1px solid #e2e8f0;border-radius:14px;padding:9px 12px;background:#f8fafc}.toast{position:fixed;right:22px;bottom:22px;background:#0f172a;color:white;padding:12px 16px;border-radius:15px;display:none}.toast.show{display:block}@media(max-width:900px){.app{grid-template-columns:1fr}.toolbar,.cards,.grid{grid-template-columns:1fr}.tablewrap{overflow:auto}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">WL</div><div><h1>TSMC WorkLog</h1><p>Fast Sync</p></div></div><nav class="nav"><button id="navWork" class="active" onclick="showTab('work')">📋 WorkLog</button><button id="navStatus" onclick="showTab('config','Status')">🏷️ Status</button><button id="navEndPoint" onclick="showTab('config','EndPoint')">🔀 EndPoint</button><button id="navResponsibilty" onclick="showTab('config','Responsibilty')">👤 Responsibilty</button><button id="navTicketType" onclick="showTab('config','TicketType')">📨 Ticket Type</button></nav></aside><main class="main"><section id="workTab"><div class="hero"><div class="top"><div class="title"><h2>WorkLog Dashboard</h2><p>Fast sync + checkbox update ทันที</p></div><div><button class="btn" onclick="refresh(true)">↻ Refresh</button> <button class="btn primary" onclick="openNew()">＋ ADD</button></div></div><div class="cards"><div class="card"><div id="mTotal" class="metric">0</div><div class="label">Total</div></div><div class="card"><div id="mInprocess" class="metric">0</div><div class="label">Inprocess</div></div><div class="card"><div id="mRelocate" class="metric">0</div><div class="label">Relocate</div></div><div class="card"><div id="mDone" class="metric">0</div><div class="label">Done</div></div></div></div><div class="toolbar"><input id="q" oninput="applyFilters()" placeholder="ค้นหา"><select id="fStatus" onchange="applyFilters()"></select><select id="fResp" onchange="applyFilters()"></select><input id="fDate" type="date" onchange="applyFilters()"><button class="btn" onclick="clearFilters()">Clear</button></div><div class="tablewrap"><table><thead><tr><th>No.</th><th>Timestamp</th><th>Date</th><th>Ticket</th><th>Description</th><th>Status</th><th>Endpoint</th><th>Responsibilty</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table><div class="pager"><button class="btn" onclick="prevPage()">Prev</button><span id="pageInfo"></span><button class="btn" onclick="nextPage()">Next</button></div></div></section><section id="configTab" style="display:none"><div class="hero"><div class="top"><div class="title"><h2 id="cfgTitle">Config</h2><p id="cfgSub">Responsibilty checkbox จะอัพเดททันที</p></div><button class="btn primary" onclick="openConfigNew()">＋ ADD</button></div></div><div class="toolbar" style="grid-template-columns:1fr auto"><input id="cfgQ" oninput="renderConfig()" placeholder="ค้นหา config"><button class="btn" onclick="cfgQ.value='';renderConfig()">Clear</button></div><div class="tablewrap"><table><thead id="cfgHead"></thead><tbody id="cfgBody"></tbody></table></div></section></main></div><div id="drawer" class="drawer"><div class="panel"><div class="top"><h2 id="formTitle">ADD</h2><button class="btn" onclick="closeDrawer()">Close</button></div><form id="form" class="grid" onsubmit="saveRecord(event)"></form></div></div><div id="toast" class="toast"></div><script>const API_URL='https://script.google.com/macros/s/AKfycbwAMDvzBi-azwulnM-JzaD-QK7Oiq_PXX1jMN4H1X3_9uZvcJ5tXNGE8IkaU3dK9co6lA/exec';let rows=[],meta={},filtered=[],current=null,page=1,pageSize=12,cfgSheet='Status';const tv=x=>String(x??''),esc=v=>tv(v).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),vals=n=>(meta[n]||[]).map(x=>typeof x==='object'?x.Value:x);function toastMsg(x){toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}function api(a,p={}){return new Promise((res,rej)=>{let cb='cb'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),t=setTimeout(()=>{clean();rej(Error('API timeout'))},15000);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=j=>{clean();j&&j.ok?res(j.data):rej(Error(j?.error||'API error'))};s.onerror=()=>{clean();rej(Error('โหลด API ไม่สำเร็จ'))};s.src=API_URL+'?callback='+cb+'&payload='+encodeURIComponent(JSON.stringify({action:a,...p}));document.body.appendChild(s)})}async function refresh(force=false){try{let d=await api('bootstrap',{force});rows=d.rows||[];meta=d.meta||{};buildFilters();applyFilters();renderConfig()}catch(e){toastMsg(e.message)}}function buildFilters(){fStatus.innerHTML='<option value="">All status</option>'+vals('Status').map(x=>`<option>${esc(x)}</option>`).join('');fResp.innerHTML='<option value="">All responsibilty</option>'+vals('Responsibilty').map(x=>`<option>${esc(x)}</option>`).join('')}function applyFilters(){let qq=tv(q.value).toLowerCase(),st=fStatus.value,rp=fResp.value,dt=fDate.value;filtered=rows.filter(r=>(!qq||JSON.stringify(r).toLowerCase().includes(qq))&&(!st||r.Status===st)&&(!rp||r.Responsibilty===rp)&&(!dt||tv(r.Date).slice(0,10)===dt));page=1;renderWork()}function clearFilters(){q.value=fStatus.value=fResp.value=fDate.value='';applyFilters()}function renderWork(){mTotal.textContent=rows.length;mInprocess.textContent=rows.filter(r=>r.Status==='Inprocess').length;mRelocate.textContent=rows.filter(r=>r.Status==='Relocate').length;mDone.textContent=rows.filter(r=>r.Status==='Done').length;let st=(page-1)*pageSize,rs=filtered.slice(st,st+pageSize);tbody.innerHTML=rs.map((r,i)=>`<tr><td>${st+i+1}</td><td>${esc(r.Timestamp)}</td><td>${esc(r.Date)}</td><td class=ticket>${esc(r.Ticket)}</td><td>${esc(r.Description)}</td><td><span class="pill ${esc(r.Status)}">${esc(r.Status)}</span></td><td>${esc(r.EndPoint)}</td><td>${esc(r.Responsibilty)}</td><td><button class=link onclick='openEdit(${JSON.stringify(r).replaceAll("'","&#39;")})'>Edit</button><button class=link onclick='removeRecord(${r._row})'>Delete</button></td></tr>`).join('')||'<tr><td colspan=9 style="text-align:center;padding:30px;color:#64748b">No data</td></tr>';pageInfo.textContent=`Page ${page} / ${Math.max(1,Math.ceil(filtered.length/pageSize))} • ${filtered.length} rows`}function nextPage(){if(page<Math.ceil(filtered.length/pageSize)){page++;renderWork()}}function prevPage(){if(page>1){page--;renderWork()}}function today(){return new Date().toISOString().slice(0,10)}function nextResp(){let l=(meta.Responsibilty||[]).filter(x=>x.OnDuty!==false).map(x=>x.Value),last=[...rows].reverse().find(r=>l.includes(r.Responsibilty))?.Responsibilty,idx=l.indexOf(last);return l.length?l[(idx+1)%l.length]:''}function buildForm(r={}){current=r._row?r:null;let resp=r.Responsibilty||(!current?nextResp():'');formTitle.textContent=current?'Edit WorkLog':'ADD WorkLog';form.innerHTML=`<div><label>Date</label><input name=Date type=date value="${esc(r.Date||today())}"></div><div><label>Status</label><select name=Status id=inStatus onchange=toggleEndPoint()>${vals('Status').map(x=>`<option ${x===(r.Status||'Inprocess')?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class=full><label>TicketType</label><div class=radio>${vals('TicketType').map(x=>`<label><input type=radio name=TicketType value="${esc(x)}" ${(r.TicketType||'Ticket')===x?'checked':''} onchange=toggleTicket()>${esc(x)}</label>`).join('')}</div></div><div><label>Ticket</label><input id=inTicket name=Ticket value="${esc(r.Ticket||'')}"></div><div id=epField><label>EndPoint</label><select name=EndPoint><option></option>${vals('EndPoint').map(x=>`<option ${x===r.EndPoint?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>Responsibilty</label><select name=Responsibilty>${vals('Responsibilty').map(x=>`<option ${x===resp?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class=full><label>Description</label><textarea name=Description rows=4>${esc(r.Description)}</textarea></div><div class=full><label>Cause</label><textarea name=Cause rows=3>${esc(r.Cause)}</textarea></div><div class=full><label>Solution</label><textarea name=Solution rows=3>${esc(r.Solution)}</textarea></div><div class=full><label>Remark</label><textarea name=Remark rows=2>${esc(r.Remark)}</textarea></div><div class=full><button class="btn primary">Save</button></div>`;toggleTicket();toggleEndPoint()}function toggleTicket(){let t=document.querySelector('[name=TicketType]:checked')?.value||'Ticket';if(t==='Ticket'){inTicket.disabled=false;if(vals('TicketType').includes(inTicket.value)&&inTicket.value!=='Ticket')inTicket.value=''}else{inTicket.value=t;inTicket.disabled=true}}function toggleEndPoint(){epField.style.display=inStatus.value==='Relocate'?'block':'none'}function openNew(){buildForm({Date:today(),Status:'Inprocess'});drawer.classList.add('open')}function openEdit(r){buildForm(r);drawer.classList.add('open')}function closeDrawer(){drawer.classList.remove('open')}async function saveRecord(e){e.preventDefault();let rec=Object.fromEntries(new FormData(form).entries()),tt=document.querySelector('[name=TicketType]:checked')?.value||'Ticket';rec.TicketType=tt;if(tt!=='Ticket')rec.Ticket=tt;try{let saved=current?await api('updateWorkLog',{row:current._row,record:rec}):await api('createWorkLog',{record:rec});await refresh(true);closeDrawer();toastMsg('Saved')}catch(e){toastMsg(e.message)}}async function removeRecord(row){if(confirm('ลบ?')){await api('deleteWorkLog',{row});await refresh(true)}}function showTab(tab,sheet){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));workTab.style.display=tab==='work'?'block':'none';configTab.style.display=tab==='config'?'block':'none';if(tab==='work')navWork.classList.add('active');else{cfgSheet=sheet;document.getElementById('nav'+sheet).classList.add('active');cfgTitle.textContent='Manage '+sheet;renderConfig()}}function renderConfig(){let arr=(meta[cfgSheet]||[]).filter(x=>tv(typeof x==='object'?x.Value:x).toLowerCase().includes(tv(cfgQ.value).toLowerCase()));cfgHead.innerHTML=cfgSheet==='Responsibilty'?'<tr><th>No</th><th>Name</th><th>isActive</th><th>OnDuty</th><th>Action</th></tr>':'<tr><th>No</th><th>Value</th><th>Action</th></tr>';cfgBody.innerHTML=arr.map((x,i)=>{let o=typeof x==='object'?x:{Value:x,_row:i+2};return cfgSheet==='Responsibilty'?`<tr><td>${i+1}</td><td><b>${esc(o.Value)}</b></td><td><input type=checkbox ${o.isActive?'checked':''} onchange="quickResp(${o._row},'isActive',this.checked)"></td><td><input type=checkbox ${o.OnDuty?'checked':''} onchange="quickResp(${o._row},'OnDuty',this.checked)"></td><td><button class=link onclick='editConfig(${JSON.stringify(o)})'>Edit name</button></td></tr>`:`<tr><td>${i+1}</td><td>${esc(o.Value)}</td><td><button class=link onclick='editConfig(${JSON.stringify(o)})'>Edit</button><button class=link onclick='deleteConfig(${o._row})'>Delete</button></td></tr>`}).join('')}async function quickResp(row,field,value){let old=JSON.stringify(meta);meta.Responsibilty=meta.Responsibilty.map(x=>x._row===row?{...x,[field]:value}:x).filter(x=>x.isActive!==false);buildFilters();renderConfig();applyFilters();toastMsg('Updating...');try{await api('toggleResponsibilty',{row,field,value});setTimeout(()=>refresh(true),200);toastMsg('Updated')}catch(e){meta=JSON.parse(old);buildFilters();renderConfig();applyFilters();toastMsg(e.message)}}async function openConfigNew(){let Value=prompt('เพิ่ม '+cfgSheet);if(!Value)return;await api('createConfig',{sheet:cfgSheet,record:cfgSheet==='Responsibilty'?{Value,isActive:true,OnDuty:true}:{Value}});await refresh(true)}async function editConfig(o){let Value=prompt('แก้ไข',o.Value);if(!Value)return;await api('updateConfig',{sheet:cfgSheet,row:o._row,record:cfgSheet==='Responsibilty'?{...o,Value}:{Value}});await refresh(true)}async function deleteConfig(row){if(confirm('ลบ?')){await api('deleteConfig',{sheet:cfgSheet,row});await refresh(true)}}refresh();</script></body></html>
